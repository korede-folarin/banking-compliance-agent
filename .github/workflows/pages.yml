# Publishes site/ (the always-on static demo) to GitHub Pages on every push to main that touches it.
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The data in site/data/ is built locally with `python -m src.site.build` and committed; this workflow
# only uploads the folder, so it needs no Python, no secrets and no API key.
name: Publish static demo

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
